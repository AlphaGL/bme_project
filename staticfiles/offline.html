<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#8B1538">
    <title>Offline - FUTO BME</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #8B1538 0%, #6B3FA0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
        }

        .offline-container {
            text-align: center;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .offline-icon {
            font-size: 120px;
            margin-bottom: 30px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.6;
                transform: scale(1.1);
            }
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            font-weight: 700;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            opacity: 0.9;
            line-height: 1.6;
        }

        .retry-button {
            background: white;
            color: #8B1538;
            border: none;
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .retry-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            background: #D4AF37;
            color: white;
        }

        .cached-message {
            margin-top: 30px;
            padding: 20px;
            background: rgba(255,255,255,0.15);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .wifi-icon {
            display: inline-block;
            animation: shake 0.5s infinite;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0) rotate(0deg); }
            25% { transform: translateX(-5px) rotate(-5deg); }
            75% { transform: translateX(5px) rotate(5deg); }
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff4444;
            margin-right: 8px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .status-indicator.online {
            background: #00C851;
            animation: none;
        }

        .logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .quick-links {
            margin-top: 30px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }

        .quick-link {
            background: rgba(255,255,255,0.2);
            padding: 10px 20px;
            border-radius: 20px;
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .quick-link:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .offline-icon {
                font-size: 80px;
            }

            .offline-container {
                padding: 30px 20px;
            }

            .retry-button {
                padding: 12px 30px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <img src="https://res.cloudinary.com/dasmnlwnm/image/upload/v1760695706/logo_yjajyk.jpg" 
             alt="FUTO BME Logo" class="logo">
        
        <div class="offline-icon">
            <span class="wifi-icon">📡</span>
        </div>
        
        <h1>
            <span class="status-indicator" id="statusDot"></span>
            You're Offline
        </h1>
        
        <p>
            It looks like you've lost your internet connection. 
            Don't worry, some cached content may still be available.
        </p>

        <button class="retry-button" onclick="window.location.reload()">
            🔄 Try Again
        </button>

        <div class="cached-message">
            <p style="margin: 0; font-size: 1rem; font-weight: 500;">
                <strong>💡 Tip:</strong> You can still access previously visited pages 
                while offline. Check your connection and try refreshing.
            </p>
        </div>

        <div class="quick-links">
            <a href="/" class="quick-link">🏠 Home</a>
            <a href="/student/login/" class="quick-link">🎓 Student Portal</a>
            <a href="/past-questions/" class="quick-link">📝 Past Questions</a>
            <a href="/library/" class="quick-link">📚 Library</a>
        </div>
    </div>

    <script>
        const statusDot = document.getElementById('statusDot');
        
        // Auto-retry when connection is restored
        window.addEventListener('online', () => {
            statusDot.classList.add('online');
            document.querySelector('h1').textContent = '✅ Back Online!';
            setTimeout(() => {
                window.location.reload();
            }, 1000);
        });

        // Check connection status periodically
        setInterval(() => {
            if (navigator.onLine) {
                statusDot.classList.add('online');
                window.location.reload();
            }
        }, 5000);

        // Visual feedback for online status
        window.addEventListener('offline', () => {
            statusDot.classList.remove('online');
        });

        // Check initial state
        if (navigator.onLine) {
            statusDot.classList.add('online');
            setTimeout(() => {
                window.location.reload();
            }, 1000);
        }
    </script>
</body>
</html>
